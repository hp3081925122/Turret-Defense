// 当前文件只保留最小的 Forge 开发、构建和运行配置。
plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
    id 'org.jetbrains.kotlin.jvm' version '2.2.21'
}

repositories {
    if (project.hasProperty('withClientMcp')) {
        maven {
            url = uri('D:/AI临时文件/turret-defense-dev/mcp-maven')
            content { includeGroup 'local.validation' }
        }
    }
    mavenCentral()
    maven {
        name = 'KotlinForForge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
        content { includeGroup 'thedarkcolour' }
    }
    maven {
        name = 'ApricityUI'
        url = 'https://maven.sighs.cc/repository/maven-public/'
        content { includeGroup 'com.sighs' }
    }
    maven {
        name = 'KubeJS'
        url = 'https://maven.latvian.dev/releases'
        content { includeGroup 'dev.latvian.mods' }
    }
    maven {
        name = 'JEI'
        url = 'https://maven.blamejared.com'
        content {
            includeGroup 'mezz.jei'
            includeGroupByRegex 'net[.]mezzdev.*'
        }
    }
    maven {
        name = 'Architectury'
        url = 'https://maven.architectury.dev/'
        content { includeGroup 'dev.architectury' }
    }
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = "${project.mod_id}-${project.minecraft_version}-forge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)
kotlin.jvmToolchain(17)

minecraft {
    mappings channel: project.mapping_channel, version: project.mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${project.mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            workingDirectory file(project.findProperty('clientRunDirectory') ?: 'D:/AI临时文件/turret-defense-dev/client')
            if (project.hasProperty('withClientMcp')) property 'mcp.port', '9786'
            property 'forge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            args '--nogui'
        }

        gameTestServer {
            def phase = project.findProperty('persistencePhase') ?: 'none'
            workingDirectory file(project.findProperty('testRunDirectory') ?: (phase in ['seed','verify'] ? 'D:/AI临时文件/turret-defense-dev/persistence-server' : "D:/AI临时文件/turret-defense-dev/gametest-runs/${System.currentTimeMillis()}"))
            property 'forge.enabledGameTestNamespaces', phase in ['seed','verify'] ? 'turretdefense_persistence' : project.mod_id
            property 'turretdefense.persistencePhase', project.findProperty('persistencePhase') ?: 'none'
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"
    implementation "thedarkcolour:kotlinforforge:${project.kff_version}"
    implementation fg.deobf("com.sighs:ApricityUI-forge-1.20.1:${project.apricityui_version}")
    implementation fg.deobf("dev.latvian.mods:kubejs-forge:${project.kubejs_version}")
    // Forge 开发运行需要将传递前置也登记为反混淆的模组依赖。
    implementation fg.deobf("dev.latvian.mods:rhino-forge:2001.2.2-build.17")
    implementation fg.deobf("dev.architectury:architectury-forge:9.1.12")
    compileOnly fg.deobf("mezz.jei:jei-1.20.1-forge-api:${project.jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-1.20.1-common-api:${project.jei_version}")
    if (!project.hasProperty('withoutJei')) runtimeOnly fg.deobf("mezz.jei:jei-1.20.1-forge:${project.jei_version}")
    if (project.hasProperty('withClientMcp')) runtimeOnly fg.deobf('local.validation:minecraft-mcp-forge:0.1.1-local')
}

// 统一 Kotlin、Java 和资源输出目录，满足 KFF 开发环境要求。
sourceSets.configureEach {
    def outputDir = layout.buildDirectory.dir("sourcesSets/$name")
    output.setResourcesDir(outputDir)
    java.destinationDirectory.set(outputDir)
    kotlin.destinationDirectory.set(outputDir)
}

tasks.named('processResources', ProcessResources).configure {
    filteringCharset = 'UTF-8'
    def replaceProperties = [
            minecraft_version: project.minecraft_version,
            minecraft_version_range: project.minecraft_version_range,
            forge_version: project.forge_version,
            forge_version_range: project.forge_version_range,
            loader_version_range: project.loader_version_range,
            mod_id: project.mod_id,
            mod_name: project.mod_name,
            mod_license: project.mod_license,
            mod_version: project.mod_version,
            mod_authors: project.mod_authors,
            mod_description: project.mod_description,
            kff_version: project.kff_version,
            apricityui_version: project.apricityui_version,
            kubejs_version: project.kubejs_version
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    exclude 'com/turretdefense/gametest/**'
    exclude 'com/turretdefense/ui/gametest/**'
    exclude 'data/turretdefense/structures/gametest_*.nbt'
    exclude 'data/turretdefense_persistence/structures/**'
    manifest {
        attributes([
                'Specification-Title': project.mod_id,
                'Specification-Vendor': project.mod_authors,
                'Specification-Version': '1',
                'Implementation-Title': project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor': project.mod_authors
        ])
    }
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
