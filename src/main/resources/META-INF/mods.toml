modLoader="kotlinforforge"
loaderVersion="[${kff_version},)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}
需要 Kotlin for Forge ${kff_version}、ApricityUI ${apricityui_version}；客户端需要 KubeJS ${kubejs_version}。
感谢 Kotlin for Forge、ApricityUI、KubeJS 和 JEI 的开发者。
'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="kotlinforforge"
mandatory=true
versionRange="[${kff_version},)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="apricityui"
mandatory=true
versionRange="[${apricityui_version},)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="kubejs"
mandatory=true
versionRange="[${kubejs_version},)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
