<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="aui-viewport" content="mode=browser,zoom=1,min-zoom=0.75,max-zoom=2,user-scalable=true">
<meta name="aui-font-mode" content="web">
<meta name="aui-mouse-events" content="intercept">
<link rel="stylesheet" href="../turretdefense.css">
</head>
<body class="turret_defense_screen">
<div id="turret_defense">
<div class="panel">
<h1 data-i18n="title_base"></h1>
<div class="guide"><div class="guide_line" data-i18n="base_install_hint"></div><div class="guide_line" data-i18n="power_hint"></div></div>
<div id="energy" class="status_line"></div>
<div id="head_capacity" class="status_line"></div>
<div id="machine_status" class="status_line"></div>
<div class="section">
<div class="row"><button data-i18n="upgrade" id="upgrade_machine"></button><button data-i18n="cancel" id="cancel_machine"></button></div>
<div data-i18n="upgrade_hint" class="hint"></div>
<div id="upgrade_progress" class="material_list"></div>
</div>
<div class="row"><button data-i18n="overload" id="overload"></button><div id="core_info" class="material_list"></div></div>
<div data-i18n="ammo_hint" class="hint"></div>
<div class="section_title" data-i18n="heads"></div>
<div class="head_row">
<span class="face_label" data-i18n="face_down"></span>
<div class="head_info"><div id="head_0"></div><div id="head_job_0" class="hint material_list"></div></div>
<div class="head_actions"><button data-i18n="upgrade" id="upgrade_0"></button><button id="cancel_0">×</button><button id="priority_0"></button></div>
</div>
<div class="head_row">
<span class="face_label" data-i18n="face_up"></span>
<div class="head_info"><div id="head_1"></div><div id="head_job_1" class="hint material_list"></div></div>
<div class="head_actions"><button data-i18n="upgrade" id="upgrade_1"></button><button id="cancel_1">×</button><button id="priority_1"></button></div>
</div>
<div class="head_row">
<span class="face_label" data-i18n="face_north"></span>
<div class="head_info"><div id="head_2"></div><div id="head_job_2" class="hint material_list"></div></div>
<div class="head_actions"><button data-i18n="upgrade" id="upgrade_2"></button><button id="cancel_2">×</button><button id="priority_2"></button></div>
</div>
<div class="head_row">
<span class="face_label" data-i18n="face_south"></span>
<div class="head_info"><div id="head_3"></div><div id="head_job_3" class="hint material_list"></div></div>
<div class="head_actions"><button data-i18n="upgrade" id="upgrade_3"></button><button id="cancel_3">×</button><button id="priority_3"></button></div>
</div>
<div class="head_row">
<span class="face_label" data-i18n="face_west"></span>
<div class="head_info"><div id="head_4"></div><div id="head_job_4" class="hint material_list"></div></div>
<div class="head_actions"><button data-i18n="upgrade" id="upgrade_4"></button><button id="cancel_4">×</button><button id="priority_4"></button></div>
</div>
<div class="head_row">
<span class="face_label" data-i18n="face_east"></span>
<div class="head_info"><div id="head_5"></div><div id="head_job_5" class="hint material_list"></div></div>
<div class="head_actions"><button data-i18n="upgrade" id="upgrade_5"></button><button id="cancel_5">×</button><button id="priority_5"></button></div>
</div>
<div class="section">
<div class="section_title" data-i18n="type"></div>
<div class="row"><input id="entity_type" type="text"><button data-i18n="apply" id="apply_type"></button></div>
</div>
<div class="storage_columns">
<container id="block_entity" bind="block_entity">
<div class="section_title" data-i18n="modules"></div>
<div class="slot_row">
<slot id="module_0" slot-index="0"></slot>
<slot id="module_1" slot-index="1"></slot>
<slot id="module_2" slot-index="2"></slot>
<slot id="module_3" slot-index="3"></slot>
<slot id="module_4" slot-index="4"></slot>
</div>
<div class="section_title" data-i18n="cache"></div>
<div class="slot_grid">
<slot id="cache_0" slot-index="5"></slot>
<slot id="cache_1" slot-index="6"></slot>
<slot id="cache_2" slot-index="7"></slot>
<slot id="cache_3" slot-index="8"></slot>
<slot id="cache_4" slot-index="9"></slot>
<slot id="cache_5" slot-index="10"></slot>
<slot id="cache_6" slot-index="11"></slot>
<slot id="cache_7" slot-index="12"></slot>
<slot id="cache_8" slot-index="13"></slot>
<slot id="cache_9" slot-index="14"></slot>
<slot id="cache_10" slot-index="15"></slot>
<slot id="cache_11" slot-index="16"></slot>
<slot id="cache_12" slot-index="17"></slot>
<slot id="cache_13" slot-index="18"></slot>
<slot id="cache_14" slot-index="19"></slot>
<slot id="cache_15" slot-index="20"></slot>
<slot id="cache_16" slot-index="21"></slot>
<slot id="cache_17" slot-index="22"></slot>
<slot id="cache_18" slot-index="23"></slot>
<slot id="cache_19" slot-index="24"></slot>
<slot id="cache_20" slot-index="25"></slot>
<slot id="cache_21" slot-index="26"></slot>
<slot id="cache_22" slot-index="27"></slot>
<slot id="cache_23" slot-index="28"></slot>
<slot id="cache_24" slot-index="29"></slot>
<slot id="cache_25" slot-index="30"></slot>
<slot id="cache_26" slot-index="31"></slot>
</div>
</container>
<div>
<div class="section_title" data-i18n="inventory"></div>
<container id="player" bind="player" layout="preset:player"></container>
</div>
</div>
</div>
</div>
<script src="../turretdefense.js"></script>
</body>
</html>
